# https://pnpm.io/settings

# Runtime matrix fixtures have independent dependency locks.
packages:
  - '**'
  - '!tests/server/adapters/pi-acp/fixtures/runtimes/**'

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  electron-winstaller: true
  esbuild: true
  lightningcss: true
  rolldown: true
  unrs-resolver: true
